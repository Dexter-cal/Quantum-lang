[package]
name = "quantum-lang"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = "0.15"
ndarray-linalg = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "qai"
path = "src/bin/cli.rs"

[lib]
name = "quantum"
path = "src/lib.rs"
