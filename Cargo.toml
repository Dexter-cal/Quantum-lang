[workspace]
members = [
    "quantum-lsp",
    "quantum-mind",
    "compiler",
    "stdlib",
    "quantumai",
    "quantumai-sys",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"

[workspace.dependencies]
anyhow = "=1.0.75"
thiserror = "=1.0.50"
serde = { version = "=1.0.193", features = ["derive"] }
serde_json = "=1.0.108"
colored = "=2.0.4"
logos = "=0.13.0"

[profile.release]
opt-level = 3
strip = true
