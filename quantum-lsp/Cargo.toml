[package]
name = "quantum-lsp"
version = "0.1.0"
edition = "2021"
description = "Language Server Protocol implementation for Quantum"

[dependencies]
quantum_compiler = { path = "../compiler", package = "quantum-compiler" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "quantum-lsp"
path = "src/main.rs"
